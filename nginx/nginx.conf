# nginx.conf - TaskVault reverse proxy
# nginx is the ONLY container with published ports. It:
#   1. redirects HTTP (80) to HTTPS (443)
#   2. terminates TLS with the self-signed certificate
#   3. adds security headers to every response
#   4. forwards requests to the app over the internal Docker network

# Don't reveal the nginx version (attackers look for vulnerable versions).
server_tokens off;

# ---------- Server 1: HTTP (port 80) -> redirect to HTTPS ----------
server {
    listen 80;
    server_name _;                     # "_" = catch-all, any host name

    # 301 = permanent redirect, same host and path.
    return 301 https://$host$request_uri;
}

# ---------- Server 2: HTTPS (port 443) -> proxy to the app ----------
server {
    listen 443 ssl;                    # this port speaks TLS
    http2 on;                          # allow HTTP/2
    server_name _;

    # --- TLS ---
    # Generated by scripts/generate-cert.*, mounted read-only, never committed.
    ssl_certificate     /etc/nginx/certs/taskvault.crt;
    ssl_certificate_key /etc/nginx/certs/taskvault.key;

    # Only modern TLS versions.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Reuse TLS sessions -> returning browsers skip the expensive handshake.
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Reject request bodies over 1 MB.
    client_max_body_size 1m;

    # --- Security headers ("always" = also on error responses) ---
    # HSTS: browser must use HTTPS for 1 year.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Don't guess content types.
    add_header X-Content-Type-Options "nosniff" always;
    # Don't allow our page inside a frame (clickjacking).
    add_header X-Frame-Options "DENY" always;
    # Don't send our URLs to other sites.
    add_header Referrer-Policy "no-referrer" always;
    # Only load scripts/styles from our own origin, no inline code (XSS protection).
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Turn off browser features we don't need.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Reverse proxy ---
    location / {
        # "app" = Compose service name, resolved by Docker's DNS.
        proxy_pass http://app:3000;

        # Pass the original request details to the app.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail fast if the app doesn't answer (nginx returns 502/504).
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
