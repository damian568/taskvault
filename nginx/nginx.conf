# =============================================================================
# nginx.conf - TaskVault reverse proxy
# -----------------------------------------------------------------------------
# nginx is the ONLY container with published ports. It:
#   1. redirects plain HTTP (port 80) to HTTPS (port 443)
#   2. terminates TLS (decrypts HTTPS) with the self-signed certificate
#   3. adds security headers to every response
#   4. forwards requests to the app container over the internal Docker network
# Mounted into the container as /etc/nginx/conf.d/default.conf (read-only).
# Everything here lives inside nginx's "http" block (the image's main config includes it).
# =============================================================================

# Don't reveal the nginx version in error pages and the "Server" header
# (attackers look for versions with known vulnerabilities).
server_tokens off;

# ---------- Server 1: HTTP (port 80) -> redirect to HTTPS ----------
server {
    listen 80;
    server_name _;            # "_" = catch-all: answer for any host name

    # 301 = permanent redirect. $host and $request_uri keep the same host and path,
    # e.g. http://localhost/api/tasks -> https://localhost/api/tasks
    return 301 https://$host$request_uri;
}

# ---------- Server 2: HTTPS (port 443) -> proxy to the app ----------
server {
    listen 443 ssl;           # "ssl" = this port speaks TLS
    http2 on;                 # allow HTTP/2 (faster: many requests over one connection)
    server_name _;

    # --- TLS ---
    # Certificate (public) and private key, generated locally by scripts/generate-cert.*
    # and mounted read-only into the container. Never committed to Git.
    ssl_certificate     /etc/nginx/certs/taskvault.crt;
    ssl_certificate_key /etc/nginx/certs/taskvault.key;

    # Only modern TLS versions. TLS 1.0/1.1 and all SSL versions are broken.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Reuse TLS sessions for a while, so returning browsers skip the expensive handshake.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # Reject request bodies over 1 MB (the app itself limits JSON to 10 KB).
    client_max_body_size 1m;

    # --- Security headers ("always" = also on error responses like 404/502) ---

    # HSTS: the browser must use HTTPS for this site for 1 year, even if the user types http://.
    # (Browsers ignore HSTS while the certificate is untrusted, as with our self-signed one.)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Don't let the browser guess ("sniff") content types - e.g. run a text file as script.
    add_header X-Content-Type-Options "nosniff" always;

    # Forbid showing our page inside a frame on another site (clickjacking protection).
    add_header X-Frame-Options "DENY" always;

    # Don't send our URLs to other sites in the Referer header.
    add_header Referrer-Policy "no-referrer" always;

    # Content-Security-Policy: the browser may only load scripts, styles, images etc. from
    # our own origin ('self'). Inline <script>/<style> and plugins are blocked, which makes
    # XSS much harder. That's why index.html has no inline code.
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Turn off browser features the app doesn't need.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Reverse proxy ---
    location / {
        # "app" is the Compose service name - Docker's internal DNS resolves it to the
        # app container's IP on the "frontend" network. Plain HTTP is fine here: this
        # traffic never leaves the Docker host.
        proxy_pass http://app:3000;

        # Pass the original request details on. Without these, the app would think
        # every request came from nginx, over plain HTTP, for host "app".
        proxy_set_header Host              $host;                       # original host name
        proxy_set_header X-Real-IP         $remote_addr;                # real client IP
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;  # chain of client/proxy IPs
        proxy_set_header X-Forwarded-Proto $scheme;                     # "https"

        # Fail fast if the app doesn't answer, instead of hanging (nginx returns 502/504).
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
