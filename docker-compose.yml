# docker-compose.yml - runs TaskVault as 3 containers on 2 networks.
#
#   Browser --HTTPS 443--> nginx --HTTP 3000--> app --TCP 5432--> db --> volume
#                          [   frontend net   ]  [ backend net, internal ]
#
# Start: docker compose up --build -d      Stop: docker compose down
# ${VARIABLES} are read automatically from the .env file next to this file.

# Project name -> prefix for containers, networks and volumes.
name: taskvault

services:

  # nginx - reverse proxy. The ONLY service with published ports.
  nginx:
    image: nginx:1.30.3-alpine
    ports:
      - "80:80"                                # HTTP, only redirects to HTTPS
      - "443:443"                              # HTTPS - the real entry point
    volumes:
      # ":ro" = read-only inside the container
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend                               # can reach the app, NOT the db
    depends_on:
      app:
        condition: service_healthy             # start only when /health says OK
    restart: unless-stopped

  # app - Node.js API + web page. No published ports.
  app:
    build: ./app                               # build from app/Dockerfile
    environment:
      PORT: 3000
      DB_HOST: db                              # service name, resolved by Docker DNS
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${APP_DB_USER}                  # LIMITED user, never the superuser
      DB_PASSWORD: ${APP_DB_PASSWORD}
    networks:
      - frontend                               # talks to nginx
      - backend                                # talks to db - only service on both
    depends_on:
      db:
        condition: service_healthy             # wait until Postgres accepts connections
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # db - PostgreSQL. NO published ports.
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}          # superuser - only for initialisation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}              # read by db/init.sh
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      # Named volume: data survives "down". Only "down -v" deletes it.
      - db_data:/var/lib/postgresql/data
      # Runs ONCE on first start (empty volume).
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      # NOT in the init folder - only run through init.sh.
      - ./db/init.sql:/sql/init.sql:ro
    networks:
      - backend                                # only the app can reach it
    healthcheck:
      # -h 127.0.0.1 = TCP check -> stays unhealthy until init.sql has finished.
      # $$ = literal $ for the shell inside the container.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

networks:
  frontend: {}                                 # nginx <-> app
  backend:
    internal: true                             # app <-> db, no route to the outside

volumes:
  db_data: {}
