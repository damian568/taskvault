<!DOCTYPE html>
<!-- index.html - the single page of TaskVault.
     No inline JavaScript or CSS, so nginx can send a strict Content-Security-Policy. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskVault</title>
  <link rel="stylesheet" href="/style.css">
  <!-- defer = run after the HTML is loaded, so all elements exist -->
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <h1>TaskVault</h1>
    <p class="subtitle">Internal team task tracker</p>

    <!-- app.js handles "submit" and calls POST /api/tasks. The server validates again. -->
    <form id="task-form">
      <label for="task-title" class="visually-hidden">New task</label>
      <input id="task-title" type="text" placeholder="What needs to be done?"
             maxlength="200" required autocomplete="off">
      <button type="submit">Add</button>
    </form>

    <!-- Status / error messages (read out by screen readers) -->
    <p id="message" role="status"></p>

    <!-- app.js fills this list from GET /api/tasks -->
    <ul id="task-list"></ul>
  </main>
</body>
</html>
